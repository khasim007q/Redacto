[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "redacto"
version = "0.1.0"
description = "Provenance-aware revocation engine for AI context"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3,<3",
    "pydantic>=2.7,<3",
    "httpx>=0.27,<1",
    "uvicorn>=0.30,<1",
    "starlette>=1.0,<2",
]

[project.optional-dependencies]
chroma = ["chromadb>=1.5.9,<2"]
redis = ["redis>=5,<8"]
semantic = ["sentence-transformers>=6.2,<7", "torch>=2.2,<3"]
dev = [
    "pytest>=8.0,<10",
    "pytest-asyncio>=0.23,<2",
    "fakeredis>=2.20,<3",
]

[project.scripts]
redacto = "redacto.cli:main"
redacto-stdio = "redacto.mcp.stdio_server:main"
redacto-http = "redacto.mcp.http_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/redacto"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

# Keep the optional CPU inference path from pulling CUDA runtimes on Linux.
# The index is explicit: ordinary dependencies continue to come from PyPI.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]

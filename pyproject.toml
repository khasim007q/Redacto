[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "redacto"
version = "0.1.0"
description = "Provenance-aware revocation engine for AI context"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.2.0",
    "pydantic>=2.7",
    "httpx>=0.27",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
redacto = "redacto.cli:main"
redacto-stdio = "redacto.mcp.stdio_server:main"
redacto-http = "redacto.mcp.http_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/redacto"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

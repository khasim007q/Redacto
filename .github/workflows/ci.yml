name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Seed fixture
        run: python -m redacto seed
      - name: Tests
        run: python -m pytest -q
      - name: stdio MCP smoke test
        run: python scripts/mcp_smoke.py
      - name: HTTP MCP smoke test
        if: runner.os == 'Linux'
        run: python scripts/mcp_http_smoke.py

  runtime-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime dependencies only
        run: |
          python -m pip install --upgrade pip
          pip install .
      - name: Every command must import without dev extras
        run: python -m redacto --help

name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install uv==0.12.23
          uv sync --frozen --python ${{ matrix.python-version }} --extra dev --extra chroma --extra redis
      - name: Tests
        run: uv run --no-sync python -m pytest -q
      - name: Adversarial disclosure evaluation
        run: |
          uv run --no-sync python tests/run_benchmark.py --out benchmark.json
      - name: Bounded scale probe
        if: runner.os == 'Linux'
        run: uv run --no-sync python tests/scale_probe.py --records 100000 --out scale.json
      - name: Publish evaluation evidence
        uses: actions/upload-artifact@v4
        with:
          name: evidence-${{ matrix.os }}-${{ matrix.python-version }}
          path: |
            benchmark.json
            scale.json
      - name: Saved profile MCP and operator approval smoke test
        run: uv run --no-sync python scripts/profile_smoke.py
      - name: HTTP MCP smoke test
        if: runner.os == 'Linux'
        run: uv run --no-sync python scripts/mcp_http_smoke.py

  runtime-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime dependencies only
        run: |
          python -m pip install --upgrade pip
          pip install .
      - name: Every command must import without dev extras
        run: |
          python -m redacto --help
          python -m redacto setup --help
          python scripts/profile_smoke.py

  redis-integration:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      REDACTO_TEST_REDIS_URL: redis://127.0.0.1:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked store test dependencies
        run: |
          python -m pip install uv==0.12.23
          uv sync --frozen --extra dev --extra chroma --extra redis
      - name: Real Redis transaction, type coverage and scope checks
        run: uv run --no-sync python -m pytest -q tests/test_real_stores.py -k redis

  semantic-integration:
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      REDACTO_TEST_NEURAL: "1"
      OMP_NUM_THREADS: "4"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install optional CPU semantic dependencies
        run: |
          python -m pip install uv==0.12.23
          uv sync --frozen --extra dev --extra semantic
      - name: Real multilingual discovery, verification and replay guard
        run: uv run --no-sync python -m pytest -q tests/test_semantic_live.py
      - name: Frozen semantic benchmark
        run: |
          uv run --no-sync python tests/run_benchmark.py --embedding-provider sentence_transformers --local-files-only --out neural.json
          uv run --no-sync python tests/run_benchmark.py --embedding-provider hybrid --local-files-only --out hybrid.json
          uv run --no-sync python tests/run_benchmark.py --embedding-provider hybrid --split holdout --local-files-only --out hybrid-holdout.json
      - uses: actions/upload-artifact@v4
        with:
          name: neural-evidence-${{ matrix.os }}
          path: |
            neural.json
            hybrid.json
            hybrid-holdout.json
